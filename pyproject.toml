[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mry-jet-alert"
version = "0.1.0"
description = "Local ATC-to-ADS-B alerting for Monterey Jet Center"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=12",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "numpy>=1.26,<2.5",
  "rapidfuzz>=3.9",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
speech = ["faster-whisper>=1.0"]
audio = ["sounddevice>=0.4.7", "webrtcvad-wheels>=2.0.14"]
liveatc = ["faster-whisper>=1.0", "webrtcvad-wheels>=2.0.14"]
control = ["PySide6>=6.7"]
build = ["PyInstaller>=6.10"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
mry-alert = "mry_alert.cli:main"
mry-alert-control = "mry_alert.control.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mry_alert"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mry_alert"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
  "yaml",
  "sounddevice",
  "webrtcvad",
  "faster_whisper",
  "PySide6",
  "PySide6.QtCore",
  "PySide6.QtGui",
  "PySide6.QtNetwork",
  "PySide6.QtWidgets",
]
ignore_missing_imports = true
